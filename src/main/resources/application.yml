spring:
  application:
    name: poke-store-backend-sb
  config:
    import: optional:file:.env[.properties]
  flyway:
    enabled: false
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pokestore}?useUnicode=true&characterEncoding=UTF-8"
    username: ${DB_USER:pokestore}
    password: ${DB_PASSWORD:pokestore_local_only}
    hikari:
      connection-test-query: SELECT 1
      max-lifetime: 280000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:2097152}
      max-request-size: ${MAX_UPLOAD_BYTES:2097152}

server:
  port: ${SERVER_PORT:8000}

springdoc:
  swagger-ui:
    path: /docs

pokestore:
  upload-dir: ${UPLOAD_DIR:uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
